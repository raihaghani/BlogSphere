{% if form.non_field_errors %}<div role="alert" class="mb-5 rounded-lg bg-red-50 p-4 text-red-800">{{ form.non_field_errors }}</div>{% endif %}{% for field in form %}<div class="form-field mb-5"><label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="mt-2 text-xs leading-5 text-slate-500">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<p role="alert" class="mt-2 text-sm text-red-700">{{ error }}</p>{% endfor %}</div>{% endfor %}
