{% load static %}<article class="group overflow-hidden rounded-2xl border border-stone-200 bg-white"><a href="{% url 'post_detail' post.slug %}" tabindex="-1" aria-hidden="true"><img src="{% static post.cover %}" alt="" loading="lazy" class="aspect-[16/10] w-full object-cover"></a><div class="p-6"><a href="{% url 'category' post.category.slug %}" class="eyebrow">{{ post.category.name }}</a><h3 class="mt-3 font-serif text-2xl leading-snug"><a href="{% url 'post_detail' post.slug %}" class="hover:text-indigo-700">{{ post.title }}</a></h3><p class="mt-3 text-sm leading-6 text-slate-600">{{ post.excerpt|default:post.content|truncatechars:130 }}</p><div class="mt-6 flex items-center justify-between border-t border-stone-100 pt-4 text-xs text-slate-500"><span>{{ post.author.username }}</span><time>{{ post.published_at|date:'M j, Y' }}</time></div></div></article>
