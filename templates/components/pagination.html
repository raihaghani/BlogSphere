{% if page_obj.has_other_pages %}<nav aria-label="Pagination" class="mt-10 flex items-center justify-center gap-5">{% if page_obj.has_previous %}<a class="chip" href="?{{ filter_query }}&amp;page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}<span class="text-sm text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="chip" href="?{{ filter_query }}&amp;page={{ page_obj.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
