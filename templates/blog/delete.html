{% extends 'base.html' %}{% block content %}<section class="auth-panel"><p class="eyebrow">DELETE ARTICLE</p><h1 class="my-4 font-serif text-3xl">Delete “{{ post.title }}”?</h1><p class="mb-7 text-slate-600">This permanently removes the article and all its comments.</p><form method="post">{% csrf_token %}<button class="rounded-lg bg-red-700 px-5 py-3 font-semibold text-white">Yes, delete article</button><a class="ml-4 text-indigo-700" href="{% url 'dashboard' %}">Keep article</a></form></section>{% endblock %}
